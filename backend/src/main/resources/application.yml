spring:
  application:
    name: pathos-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pathos}
    username: ${DB_USERNAME:pathos}
    password: ${DB_PASSWORD:pathos}

  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only ever validates it matches
      # the entities — it must never auto-generate or alter tables.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

pathos:
  jwt:
    # Local-dev-only default so a fresh checkout runs without extra setup.
    # NEVER use this default outside local development — see .env.example
    # and backend/README.md. Must be overridden in any shared environment.
    secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-before-any-real-deployment-32bytes}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    com.pathos: INFO
